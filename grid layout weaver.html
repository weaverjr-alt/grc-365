<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Weaver Grid Layout</title>

<style>
    * {margin: 0; padding: 0;}
    @font-face {
        font-family: Candara;
        src: url("Candara.ttf");
    } body {
        background: aliceblue;
    } h1 {
        font: 42pt/1.4em Satisfy;
        text-align: center;
        margin: 36px 0 24px 0;
        text-shadow: 1px 2px 3px orange;
  
    } pre {
        font: 14pt/1.4em monospace;
        width: 760px;
        margin: 0 auto;
    } #textbox {
        width: 1024px;
        height: 1024px;
        background: white;
        border: 1px solid gray;
        box-shadow: 2px 3px 6px gray;
        margin: 24px auto;
    } #picturebox {
        width: 928px;
        height: 536px;
        border: 1px dashed darkgray;
        margin: 24px auto;
        display: grid;
        grid-template: repeat(2,250px) / repeat(3,250px);
        justify-content: center;
        padding: 24px;
        gap: 12px 0;
    } figure {
        width: 200px;
    } img {
        width: 200px;
        height: auto;
    } img:hover {
        opacity: 0.67;
        transition: opacity 0.5s;
    } figcaption {
        font: 12pt/1.4em Candara;

    }
</style>
</head>
	

<body>

 
<h1>Portfolio with Grid Layout</h1>
    <div id="textbox">
<div id="picturebox">
    <figure>
      <a href="ryunosuke-kikuno-lWLfAS0CrMA-unsplash.jpg">
        <img src="ryunosuke-kikuno-lWLfAS0CrMA-unsplash.jpg" />
        </a>
        <figcaption>Tokyo, Japan</figcaption>
    </figure>
    <figure>
      <a href="ryunosuke-kikuno-neCERqrG9oQ-unsplash.jpg">
        <img src="ryunosuke-kikuno-neCERqrG9oQ-unsplash.jpg" />
        </a>
        <figcaption>Hibiya Park, Tokyo</figcaption>
    </figure>
    <figure>
        <a href="ryunosuke-kikuno-kFgBhdD81cY-unsplash.jpg">
        <img src="ryunosuke-kikuno-kFgBhdD81cY-unsplash.jpg" />
        </a>
        <figcaption> Inokashira Park, Kichijoji</figcaption>
    </figure>
 
    </div>
  
  
</body>
</html>
