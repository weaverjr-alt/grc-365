<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<style>
    * {margin: 0; padding: 0}
    @font-face {
        font-family: Georgia;
        src: url(Georgia.ttf);
    } @font-face {
        font-family: Georgia;
        src: url(Candara.ttf);
    } h1 {
        font: 48pt/1.4em Georgia;
        text-align: center;
        margin: 36px 0 0 0;
        text-shadow: 2px 3px 6px rgba(252,202,155,1.00);
    } ul {
        width: 175px;
        height: 50px;
        margin: 24px auto;
    } li {
        width: 175px;
        height: 50px;
        background: lightgray;
        border-radius: 12px;
        list-style: none;
        font: 14pt/2.6em Georgia;
        text-align: center;
    } p {
        font: 14pt/1.4em Georgia;
        width: 768px;
        margin: 12px auto;
    } a {
        color: black;
        text-decoration: none;
    } li:hover {
        background: rgba(169,225,245,0.80);
        transition: background 0.5s;
    } a {
        color: black;
        text-decoration: none;
    } .icon {
        width: 96px;
        height: 96px;
        display: block;
        margin: 0 auto;
        border: none;
        box-shadow: none;
    } .icon:hover {
        transform: none;
        background: lightgreen;
        transition: background 0.5s;
    } span {
        font: 14pt/1.4em monospace;
    } table {
        font: 14pt/1.4 Georgia;
        border: 1px solid gray;
        margin: 48px auto;
        box-shadow: 2px 3px 6px gray;
        border-collapse: collapse;
        background: url("daisy.jpg");
    } td, th {
        padding: 6px 12px;
    } tr:nth-child(2n+3) {
        background: rgba(255,255,255,0.30);
    } tr:nth-child(1) {
        background: lightblue;
    }
</style>
</head>

<body>
    <h1> Table For Music </h1>
   
    
    <table>
         <tr>
            <th colspan="3">My Favorite Artist </th>   
        </tr>
        <tr>
            <th>Column 1</th>
            <th>Column 2</th>         <th>Column 3</th>         
        </tr>
       <tr>
            <td> Marvin Gaye </td>         <td> Westide Gunn</td>         <td> Tyler the creator </td>         
        </tr>
        <tr>
            <td>Ravyn Lenae </td>         <td>Dijon</td>         <td>MK.gee</td>         
        </tr>
        <tr>
            <td>D'Angelo</td>         <td>Brenton Wood</td>         <td>Yves Tumor</td>         
        </tr>
        <tr>
            <td>Jodeci</td>         <td>Crowbar</td>         <td>Blood Orange</td>         
        </tr>
        <tr>
            <td>Kali Uchis </td>         <td>Steve Lacy</td>         <td>Aretha Franklin</td>         
        </tr>
    </table>
  
</body>
</html>
